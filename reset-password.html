<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset Password — Jadwal Lab</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--primary:#6366f1;--primary-hover:#4f46e5;--danger:#ef4444;--radius:10px}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
        .card{background:var(--card);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:420px;text-align:center}
        .logo{font-size:3rem;margin-bottom:.5rem}
        h1{font-size:1.4rem;margin-bottom:.25rem}
        .subtitle{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
        .form-group{margin-bottom:1rem;text-align:left}
        label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.3rem;font-weight:500}
        input{width:100%;padding:.65rem .85rem;background:#0f172a;border:1px solid #334155;border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none;transition:border .2s}
        input:focus{border-color:var(--primary)}
        .btn{width:100%;padding:.7rem;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .msg{padding:.6rem .85rem;border-radius:var(--radius);font-size:.82rem;margin-bottom:1rem;display:none}
        .msg-error{background:rgba(239,68,68,.1);color:var(--danger)}
        .msg-success{background:rgba(34,197,94,.1);color:#16a34a}
        .link{margin-top:.75rem;font-size:.82rem}
        .link a{color:var(--primary);text-decoration:none}
        .link a:hover{text-decoration:underline}
        .loading{color:var(--muted);font-size:.9rem}
    </style>
</head>
<body>
    <!-- Loading State -->
    <div class="card" id="loadingCard">
        <div class="logo">⏳</div>
        <h1>Memproses...</h1>
        <p class="loading">Memverifikasi link reset password.</p>
    </div>

    <!-- Error State -->
    <div class="card" id="errorCard" style="display:none">
        <div class="logo">❌</div>
        <h1>Link Tidak Valid</h1>
        <p class="subtitle" id="errorText">Link reset password tidak valid atau sudah kedaluwarsa.</p>
        <div class="link"><a href="admin.html">← Kembali ke Login</a></div>
    </div>

    <!-- New Password Form -->
    <div class="card" id="newPasswordCard" style="display:none">
        <div class="logo">🔑</div>
        <h1>Password Baru</h1>
        <p class="subtitle">Masukkan password baru Anda.</p>
        <div class="msg msg-error" id="errEl"></div>
        <div class="form-group">
            <label for="newPassword">Password Baru</label>
            <input type="password" id="newPassword" placeholder="Minimal 6 karakter" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" placeholder="Ketik ulang password" required autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="submitBtn" onclick="handleSetNewPassword()">✅ Simpan Password Baru</button>
    </div>

    <!-- Success State -->
    <div class="card" id="successCard" style="display:none">
        <div class="logo">✅</div>
        <h1>Berhasil!</h1>
        <p class="subtitle">Password Anda sudah diubah. Silakan login dengan password baru.</p>
        <div class="link"><a href="admin.html">🔐 Login Sekarang</a></div>
    </div>

    <script>
        // ─── SUPABASE CONFIG ───
        // Ganti dengan nilai dari Supabase Dashboard → Settings → API
        const SUPABASE_URL = 'https://qfbqoyyatqjgraybkhcr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gpKMwLHoTavSvhaBz70MJQ_OsBo_M1P';

        let sb;
        let isRecoverySession = false;

        try {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            showError('Supabase gagal diinisialisasi.');
        }

        // ─── CHECK RECOVERY TOKEN ───
        (async function init() {
            // Parse hash params: #access_token=...&type=recovery&...
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const type = params.get('type');
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');

            if (type !== 'recovery' || !accessToken) {
                showError('Link reset password tidak valid atau sudah kedaluwarsa.');
                return;
            }

            // Set session from recovery tokens so updateUser works
            try {
                const { error } = await sb.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken || ''
                });

                if (error) {
                    showError('Sesi tidak valid. Silakan minta link reset baru.');
                    return;
                }

                isRecoverySession = true;
                showNewPasswordForm();
                // Clean URL
                history.replaceState(null, '', window.location.pathname);
            } catch (err) {
                showError('Gagal memverifikasi link reset.');
            }
        })();

        function showError(msg) {
            document.getElementById('loadingCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'block';
            document.getElementById('errorText').textContent = msg;
        }

        function showNewPasswordForm() {
            document.getElementById('loadingCard').style.display = 'none';
            document.getElementById('newPasswordCard').style.display = 'block';
        }

        function showSuccess() {
            document.getElementById('newPasswordCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }

        // ─── SET NEW PASSWORD ───
        async function handleSetNewPassword() {
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('errEl');
            const btn = document.getElementById('submitBtn');

            errEl.style.display = 'none';

            if (!newPw || newPw.length < 6) {
                errEl.textContent = 'Password minimal 6 karakter.';
                errEl.style.display = 'block';
                return;
            }
            if (newPw !== confirmPw) {
                errEl.textContent = 'Password tidak cocok.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            try {
                const { error } = await sb.auth.updateUser({ password: newPw });
                if (error) throw error;

                showSuccess();
            } catch (err) {
                errEl.textContent = err.message || 'Gagal mengubah password.';
                errEl.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = '✅ Simpan Password Baru';
        }
    </script>
</body>
</html>
